<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f2a37">
  <title>内装図面メーカー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="btn-menu" class="icon-btn" title="メニュー" aria-label="メニュー">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <button id="proj-name" class="proj-name" title="図面情報"></button>
      <span id="save-state" class="save-state"></span>
      <div class="spacer"></div>
      <div class="seg-switch" id="mode-switch">
        <button data-mode="draw" class="on">作図</button>
        <button data-mode="sheet">用紙</button>
      </div>
      <button id="btn-check" class="text-btn check-btn" title="寸法チェック">チェック <span id="check-badge" class="badge"></span></button>
      <button id="btn-preview" class="text-btn" title="印刷プレビュー">プレビュー</button>
      <button id="btn-undo" class="icon-btn" title="元に戻す" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
      <button id="btn-redo" class="icon-btn" title="やり直し" aria-label="やり直し"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 0 0 0 10h2"/></svg></button>
      <button id="btn-fit" class="icon-btn" title="全体表示" aria-label="全体表示"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    </header>

    <nav id="tools">
      <button data-tool="select" class="on"><svg viewBox="0 0 24 24"><path d="M5 3l13 8-6 1.5L9 19z"/></svg><span>選択</span></button>
      <button data-tool="wall"><svg viewBox="0 0 24 24"><path d="M3 18L20 5" stroke-width="3.5"/><path d="M4 21c4-2 9-9 16-12" stroke-dasharray="2 2"/></svg><span>壁なぞり</span></button>
      <button data-tool="column"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10"/><path d="M7 7l10 10M17 7L7 17"/></svg><span>柱</span></button>
      <button data-tool="fixture"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><ellipse cx="12" cy="13" rx="4" ry="3"/></svg><span>設備</span></button>
      <button data-tool="furniture"><svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="8" rx="1"/><path d="M7 16v3M17 16v3M5 8V5h14v3"/></svg><span>家具</span></button>
      <button data-tool="dim"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 8v8M21 8v8M6 10l-2 4M20 10l-2 4"/></svg><span>寸法</span></button>
      <button data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 5h14M12 5v14"/></svg><span>室名</span></button>
      <button data-tool="zone"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" stroke-dasharray="3 2"/><path d="M8 15c2-4 6-4 8 0"/></svg><span>水回り</span></button>
      <button data-tool="floor"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 9.7h18M3 14.3h18M9 5v4.7M15 9.7v4.6M8 14.3V19"/></svg><span>床</span></button>
      <button data-tool="calib"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg><span>縮尺合せ</span></button>
    </nav>

    <main id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <g id="vp">
          <g id="g-under"></g>
          <g id="g-model"></g>
          <g id="g-over"></g>
        </g>
      </svg>
      <div id="hint" class="hint"></div>
      <div id="selbar" class="selbar hidden"></div>
      <aside id="issues" class="issues hidden">
        <div class="issues-head"><b>寸法チェック</b><span id="issues-sum" class="issues-sum"></span><button id="issues-close" class="icon-btn" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div id="issues-list" class="issues-list"></div>
        <div class="issues-foot"><button id="issues-unignore">無視した項目を戻す</button><button id="issues-print">要再測リストを印刷</button></div>
      </aside>
    </main>

    <footer id="status">
      <label class="tg"><input type="checkbox" id="opt-finger"><span>指で描く</span></label>
      <label class="tg"><input type="checkbox" id="opt-ortho" checked><span>直交</span></label>
      <label class="tg"><input type="checkbox" id="opt-snap" checked><span>スナップ</span></label>
      <span class="sep"></span>
      <label class="tg"><input type="checkbox" id="lay-under" checked><span>下図</span></label>
      <label class="tg"><input type="checkbox" id="lay-grid" checked><span>通り芯</span></label>
      <label class="tg"><input type="checkbox" id="lay-dims" checked><span>寸法</span></label>
      <label class="tg"><input type="checkbox" id="lay-zones" checked><span>水回り範囲</span></label>
      <label class="tg"><input type="checkbox" id="lay-check" checked><span>注意表示</span></label>
      <div class="spacer"></div>
      <span id="info" class="info"></span>
    </footer>
  </div>

  <div id="menu" class="drawer hidden">
    <div class="drawer-panel">
      <div class="drawer-head">内装図面メーカー <span class="beta-tag">β版</span></div>
      <div class="menu-group">図面</div>
      <button data-act="projects">図面一覧・新規作成</button>
      <button data-act="title">図面情報(表題欄)</button>
      <button data-act="elevation">展開図を作成</button>
      <div class="menu-group">下図</div>
      <button data-act="load-image">下図画像を読み込む / 撮影</button>
      <button data-act="underlay">下図の表示設定</button>
      <button data-act="detect">構造壁・柱を自動検出(オフライン)</button>
      <button data-act="confirm-all">検出結果をすべて確定</button>
      <button data-act="delete-detected">未確定の検出結果を削除</button>
      <div class="menu-group">作図</div>
      <button data-act="grid">通り芯(A,B,C / 1,2,3)の設定</button>
      <div class="menu-group">出力</div>
      <button data-act="preview">印刷プレビュー</button>
      <button data-act="print">印刷 / PDF保存</button>
      <button data-act="png">PNG画像で保存</button>
      <button data-act="svg">SVGで保存</button>
      <button data-act="json-save">データ書き出し(.json)</button>
      <button data-act="json-load">データ読み込み(.json)</button>
      <div class="menu-group">その他</div>
      <button data-act="settings">設定(会社名・既定値)</button>
      <button data-act="help">使い方</button>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="print-area"></div>
  <input type="file" id="file-img" accept="image/*" hidden>
  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <script src="js/store.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/render.js"></script>
  <script src="js/solve.js"></script>
  <script src="js/detect.js"></script>
  <script src="js/check.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
